<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FBFBF9" />
    <meta name="description" content="CX — Rent exceptional cars from local owners, wherever the road takes you." />
    <!-- Matches the initial loading splash's own dark background so there's
         no flash of the app's usual off-white body before React mounts and
         paints the splash itself — the bundled stylesheet's own `body`
         rule (off-white, the app's real background, inside Tailwind's own
         `@layer base`) loads shortly after and takes over once it does.
         MUST be declared inside the same `@layer base` here too: an
         unlayered rule always beats a layered one regardless of source
         order or specificity, so a plain `body { background: ... }` here
         would permanently win over the real stylesheet's rule forever,
         not just for this one pre-paint instant — which is exactly what
         happened the first time this was written unlayered: the dark
         background never actually let go, and bled through as a black
         backdrop behind every page's own layout gaps site-wide. -->
    <style>@layer base { body { background: #0a0d0b; } }</style>
    <link rel="preconnect" href="https://api.fontshare.com" crossorigin />
    <link rel="preconnect" href="https://cdn.fontshare.com" crossorigin />
    <link rel="preconnect" href="https://images.unsplash.com" crossorigin />
    <link
      href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700,900&f[]=clash-display@500,600,700&display=swap"
      rel="stylesheet"
    />
    <title>CX — Rent the car. Own the journey.</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
